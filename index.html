<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jeremy Guido | Retro Resume Arcade</title>

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@300;400;500;600&display=swap" rel="stylesheet">

  <!-- CSS -->
  <link rel="stylesheet" href="./assets/css/tokens.css" />
  <link rel="stylesheet" href="./assets/css/base.css" />
  <link rel="stylesheet" href="./assets/css/page-index.css" />
</head>

<body class="scanlines site-index">
  <!-- GAME CANVAS -->
  <canvas id="game"></canvas>

  <!-- HUD -->
  <div class="hud">
    <section class="panel">
      <div class="eyebrow">INSERT CREDENTIALS</div>
      <h1>JEREMY GUIDO</h1>

      <p>
        Hospitality first, backed by engineering discipline and stage presence.
      </p>

      <ul>
        <li>Hospitality</li>
        <li>Service</li>
        <li>Performance</li>
      </ul>

      <div class="links">
        <a class="btn alt" href="assets/resume.pdf" target="_blank" rel="noopener noreferrer">
          Open Resume PDF
        </a>

        <a class="btn" href="#" id="togglePause">
          Pause Game
        </a>

        <a class="btn" href="https://www.instagram.com/nopwron" target="_blank" rel="noopener noreferrer">
          Instagram
        </a>

        <a class="btn" href="https://github.com/nopwron" target="_blank" rel="noopener noreferrer">
          GitHub
        </a>

        <a class="btn" href="https://www.linkedin.com/in/jeremy-guido" target="_blank" rel="noopener noreferrer">
          LinkedIn
        </a>

        <a class="btn" href="mailto:jeremy.a.guido@gmail.com">
          Email
        </a>
      </div>
    </section>

    <div class="right">
      <div class="topbar">
        <div>SCORE<br><span id="score">0</span></div>
        <div>LIVES<br><span id="lives">3</span></div>
        <div>WAVE<br><span id="wave">1</span></div>
        <div>HI<br><span id="highScore">0</span></div>
      </div>
    </div>
  </div>

  <!-- CENTER MESSAGE -->
  <div id="centerMessage" class="center-message">
    <div>Press Space</div>
  </div>

  <!-- JS -->
  <script src="./assets/js/asteroids.js"></script>
</body>
</html>
