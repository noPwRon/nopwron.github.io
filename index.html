<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jeremy Guido | Retro Resume Arcade</title>
  <style>
    :root {
      --bg: #06070a;
      --panel: rgba(8, 14, 22, 0.92);
      --line: #8cf7ff;
      --line-dim: rgba(140, 247, 255, 0.35);
      --text: #d8fbff;
      --accent: #ffe169;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "Courier New", monospace;
    }

    canvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      z-index: 0;
    }

    .hud {
      position: relative;
      z-index: 2;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      padding: 16px;
    }

    .panel {
      background: var(--panel);
      border: 2px solid var(--line-dim);
      padding: 16px;
    }

    h1 { margin: 0 0 8px; }

    .badges {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      list-style: none;
      padding: 0;
    }

    .badges li {
      border: 1px solid var(--line-dim);
      padding: 6px 10px;
    }

    .links {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
    }

    .btn {
      border: 2px solid var(--line);
      padding: 8px 12px;
      text-decoration: none;
      color: var(--text);
      display: inline-block;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      background: var(--panel);
      border: 2px solid var(--line-dim);
      padding: 10px;
      font-size: 14px;
    }

    /* MOBILE CONTROLS */
    .mobile-controls {
      position: fixed;
      bottom: 10px;
      left: 0;
      right: 0;
      display: none;
      justify-content: space-between;
      padding: 10px;
      z-index: 3;
    }

    .dpad, .actions {
      display: flex;
      gap: 10px;
    }

    .touch-btn {
      width: 60px;
      height: 60px;
      border: 2px solid var(--line);
      background: rgba(140,247,255,0.1);
      color: var(--text);
      font-size: 18px;
    }

    @media (max-width: 900px) {
      .hud {
        grid-template-columns: 1fr;
      }
      .mobile-controls {
        display: flex;
      }
    }
  </style>
</head>
<body>

<canvas id="game"></canvas>

<div class="hud">
  <div class="panel">
    <h1>Jeremy Guido</h1>

    <ul class="badges">
      <li>Chef</li>
      <li>Engineer</li>
      <li>Performer</li>
    </ul>

    <div class="links">
      <a class="btn" href="resume.pdf" target="_blank">Resume</a>
      <a class="btn" href="https://github.com/nopwron" target="_blank">GitHub</a>
      <a class="btn" href="https://www.linkedin.com/in/jeremy-guido" target="_blank">LinkedIn</a>
      <a class="btn" href="mailto:jeremy.a.guido@gmail.com">Email</a>
    </div>
  </div>

  <div class="topbar">
    <div>Score: <span id="score">0</span></div>
    <div>Lives: <span id="lives">3</span></div>
  </div>
</div>

<!-- MOBILE CONTROLS -->
<div class="mobile-controls">
  <div class="dpad">
    <button class="touch-btn" data-key="ArrowLeft">◀</button>
    <button class="touch-btn" data-key="ArrowUp">▲</button>
    <button class="touch-btn" data-key="ArrowRight">▶</button>
  </div>
  <div class="actions">
    <button class="touch-btn" data-key="Space">●</button>
  </div>
</div>

<script>
const keys = new Set();

// TOUCH SUPPORT
for (const btn of document.querySelectorAll('.touch-btn')) {
  btn.addEventListener('touchstart', e => {
    e.preventDefault();
    keys.add(btn.dataset.key);
  });
  btn.addEventListener('touchend', e => {
    e.preventDefault();
    keys.delete(btn.dataset.key);
  });
}

// BASIC GAME LOOP (kept minimal here, your existing logic still applies)
</script>

</body>
</html>
