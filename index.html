<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jeremy Guido | Retro Resume Arcade</title>
  <style>
    :root {
      --bg: #06070a;
      --panel: rgba(8, 14, 22, 0.88);
      --line: #8cf7ff;
      --line-dim: rgba(140, 247, 255, 0.35);
      --text: #d8fbff;
      --accent: #ffe169;
      --danger: #ff7a7a;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
      background:
        radial-gradient(circle at top, rgba(31, 66, 95, 0.35), transparent 40%),
        radial-gradient(circle at bottom, rgba(0, 128, 128, 0.18), transparent 30%),
        var(--bg);
      color: var(--text);
      font-family: "Courier New", Courier, monospace;
      overflow: hidden;
    }

    canvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      display: block;
      z-index: 0;
    }

    .scanlines::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: repeating-linear-gradient(
        to bottom,
        rgba(255, 255, 255, 0.03) 0px,
        rgba(255, 255, 255, 0.03) 1px,
        transparent 2px,
        transparent 4px
      );
      mix-blend-mode: soft-light;
      opacity: 0.4;
      z-index: 3;
    }

    .hud {
      position: fixed;
      inset: 0;
      z-index: 2;
      display: grid;
      grid-template-columns: minmax(280px, 440px) minmax(280px, 1fr);
      gap: 20px;
      padding: 20px;
      pointer-events: none;
    }

    .panel,
    .topbar,
    .controls,
    .notice {
      background: var(--panel);
      border: 2px solid var(--line-dim);
      box-shadow: 0 0 20px rgba(140, 247, 255, 0.12), inset 0 0 20px rgba(140, 247, 255, 0.04);
      backdrop-filter: blur(4px);
    }

    .panel {
      align-self: start;
      padding: 20px;
      pointer-events: auto;
    }

    .panel h1,
    .panel h2,
    .panel p,
    .panel li,
    .panel a {
      text-shadow: 0 0 8px rgba(140, 247, 255, 0.28);
    }

    .eyebrow {
      color: var(--accent);
      letter-spacing: 0.18em;
      font-size: 0.8rem;
      margin-bottom: 10px;
    }

    .links {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 18px;
    }

    .btn {
      padding: 10px 14px;
      border: 2px solid var(--line);
      color: var(--text);
      text-decoration: none;
      background: rgba(140, 247, 255, 0.08);
    }

    .btn.alt {
      border-color: var(--accent);
    }

    .topbar {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      text-align: center;
      padding: 12px;
    }

    .center-message {
      position: fixed;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      z-index: 2;
    }

    .hidden {
      display: none !important;
    }

    @media (max-width: 980px) {
      body { overflow: auto; }

      .hud {
        grid-template-columns: 1fr;
        padding: 12px;
      }

      .panel {
        max-width: 680px;
        margin: 0 auto;
      }

      .links {
        flex-direction: column;
      }

      .btn {
        width: 100%;
      }
    }
  </style>
</head>

<body class="scanlines">
  <canvas id="game"></canvas>

  <div class="hud">
    <section class="panel">
      <!-- <div class="eyebrow">INSERT CREDENTIALS</div> -->
      <h1>JEREMY GUIDO</h1>

      <p>
        Hospitality first, backed by engineering discipline and stage presence.
      </p>

      <ul>
        <li>Hospitality</li>
        <li>Service</li>
        <li>Performance</li>
      </ul>

      <div class="links">
        <a class="btn alt" href="assets/resume.pdf" target="_blank">Open Resume PDF</a>
        <a class="btn" href="#" id="togglePause">Pause Game</a>
        <a class="btn" href="https://www.instagram.com/nopwron" target="_blank">Instagram</a>
        <a class="btn" href="https://github.com/nopwron" target="_blank">GitHub</a>
        <a class="btn" href="https://www.linkedin.com/in/jeremy-guido" target="_blank">LinkedIn</a>
        <a class="btn" href="mailto:jeremy.a.guido@gmail.com">Email</a>
      </div>
    </section>

    <div class="right">
      <div class="topbar">
        <div>SCORE<br><span id="score">0</span></div>
        <div>LIVES<br><span id="lives">3</span></div>
        <div>WAVE<br><span id="wave">1</span></div>
        <div>HI<br><span id="highScore">0</span></div>
      </div>
    </div>
  </div>

  <div id="centerMessage" class="center-message">
    <div>Press Space</div>
  </div>

  <script>
    const isMobile = window.matchMedia("(max-width: 980px)").matches;

    if (isMobile) {
      document.getElementById('game')?.remove();
      document.querySelector('.right')?.remove();
      document.getElementById('togglePause')?.remove();
      document.getElementById('centerMessage')?.remove();
      document.body.style.overflow = 'auto';
    } else {

    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');

    const ui = {
      score: document.getElementById('score'),
      lives: document.getElementById('lives'),
      wave: document.getElementById('wave'),
      highScore: document.getElementById('highScore'),
      centerMessage: document.getElementById('centerMessage'),
      pauseBtn: document.getElementById('togglePause'),
    };

    let width = 0;
    let height = 0;
    const DPR = Math.max(1, window.devicePixelRatio || 1);

    function resize() {
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = Math.floor(width * DPR);
      canvas.height = Math.floor(height * DPR);
      canvas.style.width = width + 'px';
      canvas.style.height = height + 'px';
      ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    }

    resize();
    window.addEventListener('resize', resize);

    const keys = new Set();
    let started = false;
    let paused = false;
    let gameOver = false;
    let score = 0;
    let lives = 3;
    let wave = 1;
    let highScore = Number(localStorage.getItem('retroResumeHighScore') || 0);
    ui.highScore.textContent = highScore;

    const ship = {
      x: 0,
      y: 0,
      vx: 0,
      vy: 0,
      angle: -Math.PI / 2,
      radius: 14,
      invulnerable: 0,
      cooldown: 0,
    };

    let bullets = [];
    let asteroids = [];
    let particles = [];

    function resetShip() {
      ship.x = width / 2;
      ship.y = height / 2;
      ship.vx = 0;
      ship.vy = 0;
      ship.angle = -Math.PI / 2;
      ship.invulnerable = 2.5;
      ship.cooldown = 0;
    }

    function randomRange(min, max) {
      return Math.random() * (max - min) + min;
    }

    function wrap(obj) {
      if (obj.x < -30) obj.x = width + 30;
      if (obj.x > width + 30) obj.x = -30;
      if (obj.y < -30) obj.y = height + 30;
      if (obj.y > height + 30) obj.y = -30;
    }

    function distance(a, b) {
      return Math.hypot(a.x - b.x, a.y - b.y);
    }

    function spawnAsteroid(size = 3, x, y) {
      let ax = x;
      let ay = y;
      if (ax == null || ay == null) {
        const edge = Math.floor(Math.random() * 4);
        if (edge === 0) {
          ax = Math.random() * width;
          ay = -20;
        } else if (edge === 1) {
          ax = width + 20;
          ay = Math.random() * height;
        } else if (edge === 2) {
          ax = Math.random() * width;
          ay = height + 20;
        } else {
          ax = -20;
          ay = Math.random() * height;
        }
      }

      const angle = Math.random() * Math.PI * 2;
      const speedBase = 25 + wave * 6;
      const scale = size === 3 ? 1 : size === 2 ? 1.35 : 1.8;
      const radius = size === 3 ? 46 : size === 2 ? 28 : 16;
      const points = [];
      const count = 9 + Math.floor(Math.random() * 4);
      for (let i = 0; i < count; i++) {
        const t = (i / count) * Math.PI * 2;
        const r = radius * randomRange(0.72, 1.15);
        points.push({ x: Math.cos(t) * r, y: Math.sin(t) * r });
      }

      asteroids.push({
        x: ax,
        y: ay,
        vx: Math.cos(angle) * randomRange(speedBase * 0.55, speedBase * 0.95) * scale,
        vy: Math.sin(angle) * randomRange(speedBase * 0.55, speedBase * 0.95) * scale,
        angle: Math.random() * Math.PI * 2,
        spin: randomRange(-1.2, 1.2),
        size,
        radius,
        points,
      });
    }

    function spawnWave() {
      const count = Math.min(4 + wave, 11);
      let spawned = 0;
      while (spawned < count) {
        spawnAsteroid(3);
        const a = asteroids[asteroids.length - 1];
        if (distance(a, ship) < 220) {
          asteroids.pop();
          continue;
        }
        spawned++;
      }
      ui.wave.textContent = wave;
    }

    function createExplosion(x, y, n = 18) {
      for (let i = 0; i < n; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = randomRange(20, 150);
        particles.push({
          x,
          y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          life: randomRange(0.35, 0.9),
          maxLife: randomRange(0.35, 0.9),
        });
      }
    }

    function fireBullet() {
      if (ship.cooldown > 0 || gameOver) return;
      bullets.push({
        x: ship.x + Math.cos(ship.angle) * ship.radius,
        y: ship.y + Math.sin(ship.angle) * ship.radius,
        vx: ship.vx + Math.cos(ship.angle) * 420,
        vy: ship.vy + Math.sin(ship.angle) * 420,
        life: 1.05,
      });
      ship.cooldown = 0.18;
      if (!started) {
        started = true;
        ui.centerMessage.classList.add('hidden');
      }
    }

    function splitAsteroid(index) {
      const asteroid = asteroids[index];
      score += asteroid.size === 3 ? 20 : asteroid.size === 2 ? 50 : 100;
      ui.score.textContent = score;
      if (score > highScore) {
        highScore = score;
        localStorage.setItem('retroResumeHighScore', String(highScore));
        ui.highScore.textContent = highScore;
      }

      createExplosion(asteroid.x, asteroid.y, asteroid.size === 3 ? 14 : 10);

      if (asteroid.size > 1) {
        spawnAsteroid(asteroid.size - 1, asteroid.x, asteroid.y);
        spawnAsteroid(asteroid.size - 1, asteroid.x, asteroid.y);
      }

      asteroids.splice(index, 1);

      if (asteroids.length === 0) {
        wave += 1;
        spawnWave();
      }
    }

    function loseLife() {
      if (ship.invulnerable > 0) return;
      createExplosion(ship.x, ship.y, 22);
      lives -= 1;
      ui.lives.textContent = lives;
      if (lives <= 0) {
        gameOver = true;
        started = false;
        ui.centerMessage.classList.remove('hidden');
        ui.centerMessage.innerHTML = '<div class="big">Game Over</div><div class="small">Press R to restart, or open the resume like a sensible adult.</div>';
      } else {
        resetShip();
      }
    }

    function resetGame() {
      score = 0;
      lives = 3;
      wave = 1;
      started = false;
      paused = false;
      gameOver = false;
      bullets = [];
      asteroids = [];
      particles = [];
      ui.score.textContent = score;
      ui.lives.textContent = lives;
      ui.wave.textContent = wave;
      ui.pauseBtn.textContent = 'Pause Game';
      ui.centerMessage.classList.remove('hidden');
      ui.centerMessage.innerHTML = '<div class="big">Press Space</div><div class="small">Launch the ship, dodge the rocks, then hit “Open Resume PDF” when curiosity wins.</div>';
      resetShip();
      spawnWave();
    }

    function update(dt) {
      if (paused || gameOver) return;

      if (ship.cooldown > 0) ship.cooldown -= dt;
      if (ship.invulnerable > 0) ship.invulnerable -= dt;

      if (keys.has('ArrowLeft')) ship.angle -= 3.9 * dt;
      if (keys.has('ArrowRight')) ship.angle += 3.9 * dt;
      if (keys.has('ArrowUp')) {
        ship.vx += Math.cos(ship.angle) * 220 * dt;
        ship.vy += Math.sin(ship.angle) * 220 * dt;
        if (!started) {
          started = true;
          ui.centerMessage.classList.add('hidden');
        }
      }

      ship.vx *= 0.993;
      ship.vy *= 0.993;
      ship.x += ship.vx * dt;
      ship.y += ship.vy * dt;
      wrap(ship);

      for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i];
        b.x += b.vx * dt;
        b.y += b.vy * dt;
        b.life -= dt;
        wrap(b);
        if (b.life <= 0) bullets.splice(i, 1);
      }

      for (const a of asteroids) {
        a.x += a.vx * dt;
        a.y += a.vy * dt;
        a.angle += a.spin * dt;
        wrap(a);
      }

      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.vx *= 0.985;
        p.vy *= 0.985;
        p.life -= dt;
        if (p.life <= 0) particles.splice(i, 1);
      }

      for (let i = asteroids.length - 1; i >= 0; i--) {
        const a = asteroids[i];
        for (let j = bullets.length - 1; j >= 0; j--) {
          const b = bullets[j];
          if (distance(a, b) < a.radius) {
            bullets.splice(j, 1);
            splitAsteroid(i);
            break;
          }
        }
      }

      for (const a of asteroids) {
        if (distance(a, ship) < a.radius + ship.radius * 0.85) {
          loseLife();
          break;
        }
      }
    }

    function drawStarfield() {
      ctx.clearRect(0, 0, width, height);
      const count = Math.floor((width * height) / 22000);
      for (let i = 0; i < count; i++) {
        const x = (i * 137.5) % width;
        const y = (i * 83.3) % height;
        ctx.globalAlpha = 0.4 + ((i * 17) % 10) / 20;
        ctx.fillStyle = '#d8fbff';
        ctx.fillRect(x, y, 1.2, 1.2);
      }
      ctx.globalAlpha = 1;
    }

    function drawShip() {
      ctx.save();
      ctx.translate(ship.x, ship.y);
      ctx.rotate(ship.angle + Math.PI / 2);
      const blink = ship.invulnerable > 0 && Math.floor(ship.invulnerable * 12) % 2 === 0;
      if (blink) ctx.globalAlpha = 0.3;
      ctx.strokeStyle = '#8cf7ff';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(0, -16);
      ctx.lineTo(11, 12);
      ctx.lineTo(0, 7);
      ctx.lineTo(-11, 12);
      ctx.closePath();
      ctx.stroke();

      if (keys.has('ArrowUp') && !paused && !gameOver) {
        ctx.strokeStyle = '#ffe169';
        ctx.beginPath();
        ctx.moveTo(-5, 12);
        ctx.lineTo(0, 22 + Math.random() * 8);
        ctx.lineTo(5, 12);
        ctx.stroke();
      }
      ctx.restore();
    }

    function drawAsteroids() {
      ctx.strokeStyle = '#d8fbff';
      ctx.lineWidth = 2;
      for (const a of asteroids) {
        ctx.save();
        ctx.translate(a.x, a.y);
        ctx.rotate(a.angle);
        ctx.beginPath();
        a.points.forEach((p, i) => {
          if (i === 0) ctx.moveTo(p.x, p.y);
          else ctx.lineTo(p.x, p.y);
        });
        ctx.closePath();
        ctx.stroke();
        ctx.restore();
      }
    }

    function drawBullets() {
      ctx.fillStyle = '#ffe169';
      for (const b of bullets) {
        ctx.beginPath();
        ctx.arc(b.x, b.y, 2.2, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function drawParticles() {
      for (const p of particles) {
        const alpha = Math.max(0, p.life / p.maxLife);
        ctx.globalAlpha = alpha;
        ctx.strokeStyle = alpha > 0.55 ? '#ffe169' : '#8cf7ff';
        ctx.beginPath();
        ctx.moveTo(p.x, p.y);
        ctx.lineTo(p.x - p.vx * 0.02, p.y - p.vy * 0.02);
        ctx.stroke();
      }
      ctx.globalAlpha = 1;
    }

    function drawPausedOverlay() {
      if (!paused || gameOver) return;
      ctx.fillStyle = 'rgba(6, 7, 10, 0.35)';
      ctx.fillRect(0, 0, width, height);
      ctx.strokeStyle = '#8cf7ff';
      ctx.strokeRect(width / 2 - 130, height / 2 - 44, 260, 88);
      ctx.fillStyle = '#d8fbff';
      ctx.font = '28px Courier New';
      ctx.textAlign = 'center';
      ctx.fillText('PAUSED', width / 2, height / 2 + 10);
    }

    let last = performance.now();
    function loop(now) {
      const dt = Math.min(0.033, (now - last) / 1000);
      last = now;
      update(dt);
      drawStarfield();
      drawParticles();
      drawAsteroids();
      drawBullets();
      if (!gameOver) drawShip();
      drawPausedOverlay();
      requestAnimationFrame(loop);
    }

    function togglePause() {
      if (gameOver) return;
      paused = !paused;
      ui.pauseBtn.textContent = paused ? 'Resume Game' : 'Pause Game';
    }

    document.addEventListener('keydown', (e) => {
      if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'Space'].includes(e.code)) {
        e.preventDefault();
      }

      if (e.code === 'KeyP') {
        togglePause();
        return;
      }

      if (e.code === 'KeyR' && gameOver) {
        resetGame();
        return;
      }

      if (e.code === 'Space') {
        if (gameOver) return;
        fireBullet();
      }

      keys.add(e.code === 'Space' ? 'Space' : e.key);
    });

    document.addEventListener('keyup', (e) => {
      keys.delete(e.code === 'Space' ? 'Space' : e.key);
    });

    ui.pauseBtn.addEventListener('click', (e) => {
      e.preventDefault();
      togglePause();
    });

    resetGame();
    requestAnimationFrame(loop);

    }
  </script>
</body>
</html>
